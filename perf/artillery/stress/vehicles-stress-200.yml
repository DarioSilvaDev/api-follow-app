# vehicles-stress-200.yml — ESCALÓN SUPERIOR DE SONDA DE QUIEBRE (SOLO LECTURA).
#
# Objetivo: llevar la búsqueda de la RODILLA hasta ~200 RPS. No mide capacidad
# productiva. Debe leerse junto a `vehicles-stress.yml` (10->80) y
# `vehicles-stress-150.yml` (10->150) como una misma escalera.
#
# AVISO DE VALIDEZ: a esta tasa el proceso único de Artillery y PostgreSQL
# comparten máquina con la API; si aparece un quiebre, verificar que no sea
# saturación del GENERADOR (CPU del proceso node de Artillery) antes de
# atribuirlo a la API. Ver vCPU/tareas en el Task Manager durante la corrida.
#
# Endpoints (idénticos a los otros escalones, para comparabilidad):
#   GET /api/vehicles?page=1&limit=20
#   GET /api/vehicles?page=1&limit=20&q=AB
#
# Perfil: warmup 10 RPS 20s -> rampa 10->200 RPS en 180s -> pico 200 RPS 60s.
# Aprox. ~16.3k requests en ~4.3 min.
#
# Conexiones: keepAlive:true por defecto (agentkeepalive, verificado en
# node_modules/artillery/dist/lib/core/engine_http.js) -> sin churn de puertos.
#
# Dentro de un veredicto de stress, superar p95/p99 es ESPERADO: en
# `perf/report.mjs` los umbrales pasan a ser WARNING (no fallan la corrida).
# 5xx/429/timeouts/errores de conexión SIGUEN siendo fallos duros.
config:
  target: "http://127.0.0.1:3001"
  phases:
    - name: warmup
      duration: 20
      arrivalRate: 10
    - name: stress_ramp
      duration: 180
      arrivalRate: 10
      rampTo: 200
    - name: peak
      duration: 60
      arrivalRate: 200
  ensure:
    thresholds:
      - http.response_time.p95: 300
      - http.response_time.p99: 800

scenarios:
  - name: vehicles-list
    weight: 1
    flow:
      - get:
          url: "/api/vehicles?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ $processEnvironment.ACCESS_TOKEN }}"
            Accept: application/json

  - name: vehicles-list-search
    weight: 1
    flow:
      - get:
          url: "/api/vehicles?page=1&limit=20&q=AB"
          headers:
            Authorization: "Bearer {{ $processEnvironment.ACCESS_TOKEN }}"
            Accept: application/json
