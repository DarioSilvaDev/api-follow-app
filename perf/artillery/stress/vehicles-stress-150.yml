# vehicles-stress-150.yml — ESCALÓN DE SONDA DE QUIEBRE (SOLO LECTURA).
#
# Objetivo: extender la búsqueda de la RODILLA por encima del escalón de 80 RPS.
# No mide capacidad productiva; busca el RPS a partir del cual la latencia deja
# de ser plana. Debe leerse junto a `vehicles-stress.yml` (10->80) y
# `vehicles-stress-200.yml` (10->200) como una misma escalera.
#
# Endpoints (los más costosos: JwtAuthGuard + ContextGuard + ownership +
# includes anidados), idénticos al escalón de 80 RPS para que sea comparable:
#   GET /api/vehicles?page=1&limit=20
#   GET /api/vehicles?page=1&limit=20&q=AB
#
# Perfil: warmup 10 RPS 20s -> rampa 10->150 RPS en 150s -> pico 150 RPS 45s.
# Aprox. ~12.6k requests en ~3.6 min.
#
# Conexiones: Artillery usa agentkeepalive con keepAlive:true por defecto
# (verificado en node_modules/artillery/dist/lib/core/engine_http.js), por lo
# que las conexiones se reutilizan y no hay churn de puertos efímeros.
#
# Dentro de un veredicto de stress, superar p95/p99 es ESPERADO: en
# `perf/report.mjs` los umbrales pasan a ser WARNING (no fallan la corrida).
# 5xx/429/timeouts/errores de conexión SIGUEN siendo fallos duros.
config:
  target: "http://127.0.0.1:3001"
  phases:
    - name: warmup
      duration: 20
      arrivalRate: 10
    - name: stress_ramp
      duration: 150
      arrivalRate: 10
      rampTo: 150
    - name: peak
      duration: 45
      arrivalRate: 150
  ensure:
    thresholds:
      - http.response_time.p95: 300
      - http.response_time.p99: 800

scenarios:
  - name: vehicles-list
    weight: 1
    flow:
      - get:
          url: "/api/vehicles?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ $processEnvironment.ACCESS_TOKEN }}"
            Accept: application/json

  - name: vehicles-list-search
    weight: 1
    flow:
      - get:
          url: "/api/vehicles?page=1&limit=20&q=AB"
          headers:
            Authorization: "Bearer {{ $processEnvironment.ACCESS_TOKEN }}"
            Accept: application/json
