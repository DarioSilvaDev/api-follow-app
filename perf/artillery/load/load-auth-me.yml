# load-auth-me.yml — Carga sobre el costo de autenticación (SOLO LECTURA).
#
# Escenario aislado: GET /api/auth/me.
# Mide: JWT (firma + exp) + lookup de usuario + get-session. Sin throttler.
#
# Perfil: warmup (2 RPS, 60s) -> ramp (2->10 RPS, 60s) -> sustained (10 RPS, 120s).
# Valores conservadores para baseline local; NO son un SLO.
config:
  target: "http://127.0.0.1:3001"
  phases:
    - name: warmup
      duration: 60
      arrivalRate: 2
    - name: ramp
      duration: 60
      arrivalRate: 2
      rampTo: 10
    - name: sustained
      duration: 120
      arrivalRate: 10
  ensure:
    # Gauges PROVISIONALES. Exit code != 0 al final es informativo, no bloqueante.
    thresholds:
      - http.response_time.p95: 300
      - http.response_time.p99: 800

scenarios:
  - name: auth-me
    flow:
      - get:
          url: "/api/auth/me"
          headers:
            Authorization: "Bearer {{ $processEnvironment.ACCESS_TOKEN }}"
            Accept: application/json
